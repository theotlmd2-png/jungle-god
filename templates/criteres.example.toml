# Critères de balayage. Copie ce fichier en criteres.toml à la racine et adapte-le à TON profil.
# Claude le réécrit avec toi pendant l'entretien de départ (voir SKILL.md, étape 0).

[recherche]
villes = [
  "Paris", "Boulogne-Billancourt", "Levallois-Perret", "Neuilly-sur-Seine", "Puteaux", "Courbevoie",
  "Issy-les-Moulineaux", "Montreuil", "Saint-Ouen", "Saint-Denis", "Clichy", "Nanterre", "La Défense",
]
accepter_full_remote = true
# Filtre Algolia brut : pays + CDI. Pour un CDD : contract_type:temporary ; freelance : contract_type:freelance
filtre_algolia = "offices.country_code:FR AND contract_type:full_time"

# Une famille = un métier visé. Les requêtes sont des mots-clés, pas des intitulés exacts :
# c'est ce qui fait remonter des offres qu'on n'aurait jamais trouvées à la main.
[[familles]]
nom = "ia-automatisation"
requetes = [
  "IA", "IA générative", "AI builder", "product builder", "no-code", "low-code", "automatisation",
  "n8n", "Make", "Zapier", "agents IA", "LLM", "Claude", "ChatGPT", "AI ops", "adoption IA",
  "formateur IA", "consultant IA", "chef de projet IA", "solutions engineer", "forward deployed",
  "RevOps", "business operations", "process automation", "Claude Code", "vibe coding",
]
titre_inclure = '\bIA\b|\bAI\b|automat|builder|agent|no.?code|low.?code|n8n|zapier|claude|gpt|llm|prompt|ops\b|revops|g[ée]n[ée]rative|intelligence artificielle'
titre_exclure = 'senior|sénior|staff|principal|head of|director|directeur|lead\b|\bVP\b|stage|alternance|intern|scientist|research|machine learning|data engineer|backend|frontend|full.?stack|devops'

[[familles]]
nom = "growth-marketing"
requetes = ["growth", "growth marketing", "acquisition", "CRM", "lifecycle", "content", "social media", "UGC", "creative strategist"]
titre_inclure = 'growth|acquisition|crm|lifecycle|content|contenu|social|ugc|creative|marketing|communication'
titre_exclure = 'senior|sénior|head of|director|directeur|lead\b|\bVP\b|stage|alternance|intern|manager.*(équipe|team)'
