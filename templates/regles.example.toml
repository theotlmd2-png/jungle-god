# Règles RÉGLABLES : elles s'adaptent à la personne. Claude les remplit pendant l'onboarding
# (references/onboarding.md) et les relit au début de chaque lot.
# Chaque règle a une valeur par défaut. Pour désactiver une règle, mets `actif = false`.
# Le SOCLE (ordre du pipeline, zéro invention, GO humain, liste noire) n'est pas ici : il ne se désactive pas.

[tri]
experience_max_ans = 2          # écarter les offres qui demandent plus que ça
stretch_max_pourcent = 20       # part maximale d'offres « un critère au-dessus » dans un lot
age_max_offre_jours = 14
ecarter_diplome_exige = true    # écarter si un diplôme absent du profil est écrit comme obligatoire
langues_acceptees = ["français"]  # ajouter "anglais" si le niveau le permet vraiment
taille_lot = 12                 # nombre d'offres visé par shortlist
dosage = {}                     # ex. { "bizdev" = 4 } : au plus 4 offres de cette famille par lot

[lettre]
actif = true                    # false = CV seul, pas de lettre (certains préfèrent)
paragraphes = [3, 5]
tutoiement = false              # true pour les startups qui tutoient dans leur fiche
ouverture = "Bonjour,"
langue = "celle de l'annonce"
lien_unique = true              # un seul lien (portfolio, GitHub…) par candidature, en fin de lettre
lien = ""                       # l'URL à citer
paragraphe_ecart = "une phrase" # "aucun" | "une phrase" | "un paragraphe"
formules_interdites = ["passionné", "je coche toutes les cases", "n'hésitez pas"]
mentions_interdites = []        # projets ou faits à ne jamais citer

[cv]
un_cv_par_famille = true        # false = Claude peut retoucher légèrement le CV par offre
format = "pdf"

[formulaire]
repondre_a_toutes_les_questions = true
pretentions = "fourchette du profil, sinon celle de l'annonce"
questions_sensibles = "ne pas répondre"

[envoi]
mode = "claude_envoie_apres_go"  # "claude_envoie_apres_go" | "claude_remplit_humain_envoie" | "textes_seulement"
consentements_obligatoires = "demander"  # "demander" | "accord_global_donne"
repostuler_meme_entreprise = "autre_metier_seulement"  # "jamais" | "autre_metier_seulement"

[suivi]
gmail = false                   # true si le MCP Gmail est branché : relevé des réponses en fin de lot
