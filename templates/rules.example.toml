# ADJUSTABLE rules. Nothing in here is a recommendation: every value is set with the user during
# onboarding (references/onboarding.md, block E) and reread at the start of every batch.
# Neutral defaults below mean "no filter". The CORE (pipeline order, zero invention, human GO,
# blacklist) is not in here: it cannot be turned off.

[triage]
max_years_required = 0          # skip listings asking for more years than this; 0 = no limit
min_years_required = 0          # skip listings that are too junior for the profile; 0 = no limit
stretch_max_percent = 20        # max share of "one requirement above the profile" listings in a batch
max_listing_age_days = 14
skip_if_degree_required = false # true = skip when a degree the profile lacks is written as mandatory
languages = []                  # languages the user can work in, with a real level, e.g. ["French", "English"]
batch_size = 10                 # listings per shortlist
quota = {}                      # e.g. { "family-name" = 4 }: at most 4 listings of that family per batch
deal_breakers = []              # free text, e.g. ["agency roles", "100 % cold calling", "night shifts"]

[channels]
wttj = true
career_sites = true             # company career pages and ATS (Greenhouse, Lever, Teamtailor, Ashby, Workable…)
other_boards = []               # e.g. ["Indeed", "LinkedIn", "HelloWork", "APEC"]
spontaneous = false             # spontaneous applications by email (drafted, never sent without a GO)

[letter]
enabled = true                  # false = CV only, no cover letter
paragraphs = [3, 5]
tone = ""                       # set at onboarding, e.g. "formal", "warm", "informal (tu)"
opening = ""                    # set at onboarding, in the letter's language
language = "same as the listing"
single_link = true              # one link (portfolio, GitHub…) per application, at the end of the letter
link = ""
gap_sentence = "one sentence"   # "none" | "one sentence" | "one paragraph"
banned_phrases = []             # filled from the user's feedback on the model letter
never_mention = []              # projects or facts never to be cited

[cv]
one_cv_per_family = true        # false = Claude may lightly tweak the CV per listing
format = "pdf"

[forms]
answer_every_question = true
salary = "profile range, else the listing's range"
sensitive_questions = "prefer not to say"
accounts = "ask"                # "ask" | "user_creates" | "claude_creates_with_user_email" (password typed by the user)

[sending]
mode = "claude_fills_user_sends"  # "claude_sends_after_go" | "claude_fills_user_sends" | "texts_only"
mandatory_consents = "ask"      # "ask" | "blanket_ok_given"
reapply_same_company = "never"  # "never" | "other_job_only"

[notify]
desktop = true                  # macOS / Linux notification after each application (scripts/notify.py)
recap = true                    # scoreboard page + chat recap at the end of each batch

[follow_up]
gmail = false                   # true if a Gmail MCP is connected: read replies at the end of each batch
